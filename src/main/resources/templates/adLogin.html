<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理员登录</title>
  <link rel="stylesheet" href="/css/adLogin.css">
</head>
<body>
<!-- 登录卡片 -->
<div class="card">
  <!-- 顶部标题区域 -->
  <div class="header">
    <h1>管理员登录</h1>
    <p>欢迎登录，管理系统</p>
  </div>

  <div class="user-link-container">
    <a href="/user/" class="user-link">返回用户登录入口</a>
  </div>

  <!-- 表单区域 -->
  <form action="/admin/adLoginVerify"  class="form-container">
    <!-- 账号输入 -->
    <div class="form-group">
      <label for="adminid">
        <span class="input-icon">👤</span>账号
      </label>
      <div class="input-container">
        <span class="input-icon">👤</span>
        <input type="text" id="adminid" name="adminid" placeholder="请输入您的账号" required>
      </div>
    </div>

    <!-- 密码输入 -->
    <div class="form-group">
      <label for="password">
        <span class="input-icon">🔒</span>密码
      </label>
      <div class="input-container">
        <span class="input-icon">🔒</span>
        <input type="password" id="password" name="password" placeholder="请输入您的密码" required>
      </div>
    </div>

    <!-- 按钮区域 -->
    <div class="button-group">
      <button type="submit" class="btn-primary">
        <span>→</span> 登录
      </button>
      <button type="reset" class="btn-secondary">
        <span>↻</span> 重置
      </button>
    </div>
  </form>

  <!-- 底部信息 -->
  <div class="footer">
    <p>© 2025 校园低碳行为管理与积分系统 | 绿色出行 · 节约能源 · 爱护环境</p>
  </div>
</div>
</body>
</html>
